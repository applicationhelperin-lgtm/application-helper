<!DOCTYPE html>
<html lang="hi" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Application Helper — औपचारिक पत्र जनरेटर</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* तहसील पेज वाले हूबहू कलर्स */
:root, :root[data-theme="light"] {
  color-scheme: light;
  --bg: #eef1f5;
  --card: #ffffff;
  --inp: #ffffff;
  --bd: #cfd6df;
  --tx: #1b2430;
  --mu: #5a6675;
  --pr: #1f4e8c;
  --prh: #173d6e;
  --br: #1f4e8c;
  --paper: #ffffff;
  --sh: 0 4px 18px rgba(0,0,0,.06);
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #12161c;
  --card: #1c222b;
  --inp: #242c38;
  --bd: #333c48;
  --tx: #e8edf3;
  --mu: #9aa6b4;
  --pr: #6ea3e6;
  --prh: #8cb8f0;
  --br: #6ea3e6;
  --paper: #1c222b;
  --sh: 0 6px 24px rgba(0,0,0,.45);
}

*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--tx);font-family:"Noto Sans Devanagari","Inter",system-ui,sans-serif;line-height:1.7;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);transition:background .25s,color .25s}
h1,h2,h3{color:var(--pr);margin:0 0 .5em;font-weight:700}
.wrap{max-width:1100px;margin:0 auto;padding:0 20px}
header.site{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--card);border-bottom:1px solid var(--bd)}
.bar{max-width:1100px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;color:var(--pr);text-decoration:none;cursor:pointer}
.brand strong{font-size:1.15rem;line-height:1.2;font-weight:700}
.brand span{font-size:.75rem;color:var(--mu)}
.acts{display:flex;gap:8px;align-items:center}
.ab{background:var(--bg);border:1px solid var(--bd);color:var(--tx);border-radius:20px;padding:6px 14px;font:600 .84rem inherit;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:.2s}
.ab:hover{border-color:var(--pr);color:var(--pr)}
nav.main{display:flex;gap:2px;flex-wrap:wrap}
nav.main button{background:none;border:0;cursor:pointer;font-family:inherit;font-size:.9rem;color:var(--mu);padding:7px 10px;border-radius:6px;transition:.2s}
nav.main button:hover,nav.main button[aria-current]{color:var(--pr);background:var(--bg);font-weight:600}
.tg{display:none}
@media(max-width:890px){.tg{display:block}nav.main{display:none;width:100%;flex-direction:column}nav.main.open{display:flex}}
.page{display:none;padding:32px 0}.page.active{display:block}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:600 .95rem inherit;padding:10px 18px;border-radius:6px;border:1.5px solid transparent;cursor:pointer;transition:.2s}
.bp{background:var(--pr);color:#fff}.bp:hover{background:var(--prh)}
:root[data-theme="dark"] .bp{color:#0d1622}
.bg{background:transparent;border-color:var(--bd);color:var(--tx)}.bg:hover{border-color:var(--pr);color:var(--pr)}
.hero{display:grid;grid-template-columns:1.2fr .8fr;gap:28px;align-items:center}
@media(max-width:820px){.hero{grid-template-columns:1fr}}
.box{background:var(--card);border:1px solid var(--bd);padding:22px;border-radius:10px;box-shadow:var(--sh)}
select,input,textarea{width:100%;font-family:inherit;font-size:.93rem;color:var(--tx);background:var(--inp);border:1px solid var(--bd);border-radius:6px;padding:9px 12px;transition:.2s}
select:focus,input:focus,textarea:focus{outline:2px solid var(--pr);outline-offset:1px}
textarea{resize:vertical;min-height:100px}
.grid10{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.cat{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:18px;cursor:pointer;transition:.2s}
.cat:hover{border-color:var(--pr);transform:translateY(-3px);box-shadow:var(--sh)}
.cat h3{font-size:1.05rem;margin-bottom:6px}.cat p{font-size:.84rem;color:var(--mu);margin:0 0 8px;line-height:1.5}
.gen{display:grid;grid-template-columns:1fr 1fr;gap:26px;align-items:start}
@media(max-width:880px){.gen{grid-template-columns:1fr}}
.f{margin-bottom:12px}.f label{display:block;font-size:.85rem;font-weight:600;color:var(--mu);margin-bottom:4px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:520px){.row{grid-template-columns:1fr}}
fieldset{border:0;padding:0;margin:14px 0}legend{color:var(--pr);font-weight:700;margin-bottom:8px}
.pv{position:sticky;top:90px}
.paper{background:var(--paper);border:1px solid var(--bd);border-radius:6px;box-shadow:var(--sh);padding:28px;min-height:420px;white-space:pre-wrap;line-height:1.8}
.pa{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.req{margin-top:24px;background:var(--card);border:1.5px dashed var(--bd);border-radius:8px;padding:18px;text-align:center}
.doc{max-width:74ch}.doc h3{margin-top:1.4em;font-size:1.1rem}.doc p{color:var(--mu);margin:0 0 .6em}
footer{border-top:1px solid var(--bd);padding:26px 0;color:var(--mu);font-size:.88rem;margin-top:40px;background:var(--card)}
.fg{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap}
.fl{display:flex;gap:10px;flex-wrap:wrap}.fl button{background:none;border:0;color:var(--mu);cursor:pointer;font-family:inherit}.fl button:hover{color:var(--pr)}
#toast{display:none;position:fixed;bottom:calc(24px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--pr);color:#fff;padding:8px 20px;border-radius:30px;font-size:.88rem;z-index:100}
:root[data-theme="dark"] #toast{color:#0d1622}
@media print{header,footer,.pa,.box,.req,.no-print{display:none!important}.page{display:none!important}#p-generator{display:block!important}.gen{display:block}.paper{border:0;box-shadow:none;background:#fff;color:#000;font-size:13pt}}
</style>
</head>
<body>
<header class="site"><div class="bar">
<a class="brand" data-nav="home"><strong data-i="brand"></strong><span data-i="sub"></span></a>
<div class="acts no-print">
<button class="ab" id="langBtn" type="button">🌐 <span id="langT"></span></button>
<button class="ab" id="themeBtn" type="button"><span id="thI"></span> <span id="thT"></span></button>
<button class="ab tg" id="navToggle" type="button">☰</button></div>
<nav class="main" id="mainNav">
<button data-nav="home" data-i="nHome"></button><button data-nav="generator" data-i="nGen"></button><button data-nav="about" data-i="nAbout"></button><button data-nav="contact" data-i="nContact"></button><button data-nav="privacy" data-i="nPrivacy"></button><button data-nav="terms" data-i="nTerms"></button><button data-nav="disclaimer" data-i="nDisc"></button>
</nav></div></header>
<main>

<!-- होमपेज -->
<section class="page active" id="p-home"><div class="wrap">
<div class="hero"><div>
<h1 data-i="heroH"></h1><p data-i="heroD" style="color:var(--mu)"></p>
<div class="box" style="margin-top:18px"><label for="quick" data-i="pick" style="display:block;font-weight:600;margin-bottom:6px"></label>
<select id="quick" style="margin-bottom:12px"></select>
<button class="btn bp" id="quickBtn" style="width:100%" data-i="writeBtn" type="button"></button></div></div>
<div class="box" style="text-align:center"><h3 data-i="fastH"></h3><p data-i="fastP" style="font-size:.9rem;color:var(--mu);margin:0"></p></div></div>
<div style="text-align:center;margin:36px 0 22px"><h2 data-i="catsH"></h2><p data-i="catsP" style="color:var(--mu);font-size:.92rem;margin:0"></p></div>
<div class="grid10" id="cats"></div>
</div></section>

<!-- त्वरित जनरेटर -->
<section class="page" id="p-generator"><div class="wrap">
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px;flex-wrap:wrap"><button class="btn bg" data-nav="home" data-i="back"></button><span data-i="live" style="font-size:.85rem;color:var(--mu)"></span></div>
<div class="gen"><div class="box"><form id="form" onsubmit="return false">
<div class="f"><label for="cat" data-i="fCat"></label><select id="cat"></select></div>
<div class="f"><label for="type" data-i="fType"></label><select id="type"></select></div>
<fieldset><legend data-i="fSender"></legend>
<div class="row"><div class="f"><label for="sName" data-i="fName"></label><input id="sName" data-ph="phName"></div><div class="f"><label for="sRole" data-i="fRole"></label><input id="sRole" data-ph="phRole"></div></div>
<div class="f"><label for="sAddr" data-i="fAddr"></label><input id="sAddr" data-ph="phAddr"></div>
<div class="row"><div class="f"><label for="sMob" data-i="fMob"></label><input id="sMob" type="tel" data-ph="phMob"></div><div class="f"><label for="date" data-i="fDate"></label><input id="date" type="date"></div></div></fieldset>
<fieldset><legend data-i="fTo"></legend>
<div class="f"><label for="to" data-i="fToWhom"></label><input id="to"></div><div class="f"><label for="org" data-i="fOrg"></label><input id="org"></div></fieldset>
<fieldset><legend data-i="fMain"></legend>
<div class="f"><label for="subj" data-i="fSubject"></label><input id="subj"></div>
<div class="f"><label for="sal" data-i="fSal"></label><select id="sal"></select></div>
<div class="f"><label for="body" data-i="fBody"></label><textarea id="body"></textarea></div>
<div class="f"><label for="close" data-i="fClose"></label><select id="close"></select></div></fieldset>
</form></div>
<div class="pv"><div class="paper" id="paper"></div>
<div class="pa no-print"><button class="btn bp" id="printBtn" data-i="print"></button><button class="btn bg" id="copyBtn" data-i="copy"></button><button class="btn bg" id="resetBtn" data-i="reset"></button></div>
<div class="req no-print"><strong style="color:var(--pr)" data-i="reqH"></strong><p data-i="reqP" style="font-size:.83rem;color:var(--mu);margin:4px 0 10px"></p><a class="btn bg" style="padding:5px 12px;font-size:.82rem" href="mailto:applicationhelper.in@gmail.com?subject=New%20Letter%20Request" data-i="reqBtn"></a></div>
</div></div></div></section>

<!-- अन्य पेज -->
<section class="page" id="p-about"><div class="wrap doc" data-doc="about"></div></section>

<!-- संपर्क करें (Contact Us) एवं राय फॉर्म -->
<section class="page" id="p-contact">
  <div class="wrap" style="max-width:680px; margin:0 auto;">
    <div style="text-align:center; margin-bottom:24px;">
      <h2>संपर्क करें एवं राय साझा करें</h2>
      <p style="color:var(--mu); font-size:0.92rem; margin:0;">
        कोई नया प्रारूप जुड़वाना चाहते हैं या कोई सुझाव है? नीचे फॉर्म भरें, यह सीधे हमारे जीमेल पर प्राप्त होगा।
      </p>
    </div>

    <div class="box">
      <form id="contactForm" action="https://formsubmit.co/applicationhelper.in@gmail.com" method="POST" onsubmit="return validateContactForm(event)">
        <input type="hidden" name="_next" value="https://applicationhelperin-lgtm.github.io/application-helper/">
        <!-- 1. हिडन हनीपॉट (स्पैम बॉट ट्रैप) -->
        <input type="text" name="_honey" style="display:none !important;" tabindex="-1" autocomplete="off">
        <input type="hidden" name="_subject" value="नया सुझाव / पत्र अनुरोध — Application Helper">
        <input type="hidden" name="_template" value="table">
        <input type="hidden" name="_captcha" value="false">

        <!-- नाम -->
        <div class="f">
          <label for="c_name">आपका पूरा नाम <span style="color:red">*</span></label>
          <input type="text" id="c_name" name="आवेदक_का_नाम" placeholder="जैसे: राहुल शर्मा" required maxlength="50">
        </div>

        <!-- मोबाइल व ईमेल -->
        <div class="row">
          <div class="f">
            <label for="c_mob">मोबाइल नंबर <span style="color:red">*</span></label>
            <input type="tel" id="c_mob" name="मोबाइल_नंबर" placeholder="10 अंकों का नंबर" pattern="[6-9][0-9]{9}" title="कृपया 10 अंकों का मान्य भारतीय मोबाइल नंबर लिखें" required>
          </div>
          <div class="f">
            <label for="c_email">ईमेल पता (Email)</label>
            <input type="email" id="c_email" name="ईमेल" placeholder="name@example.com">
          </div>
        </div>

        <!-- संदेश -->
        <div class="f">
          <label for="c_msg">आपकी राय / संदेश / नया पत्र प्रारूप <span style="color:red">*</span></label>
          <textarea id="c_msg" name="संदेश_व_राय" placeholder="अपना सुझाव या आवश्यकता यहाँ लिखें..." required minlength="10" maxlength="1500" style="min-height:110px;"></textarea>
        </div>

        <!-- 2. एंटी-स्पैम मैथ कैप्चा -->
        <div class="f" style="background:var(--bg); padding:12px; border-radius:6px; border:1px solid var(--bd);">
          <label for="c_captcha" style="margin-bottom:6px;">
            🔒 सुरक्षा जांच (Anti-Spam): <strong id="captchaQuestion" style="color:var(--pr); font-size:1.1rem;"></strong> = ?
          </label>
          <input type="number" id="c_captcha" placeholder="यहाँ उत्तर लिखें" required style="max-width:180px;">
          <small id="captchaError" style="color:#e63946; display:none; font-weight:600; margin-top:4px;">गलत उत्तर! कृपया दोबारा प्रयास करें।</small>
        </div>

        <!-- सबमिट बटन -->
        <div style="margin-top:18px;">
          <button type="submit" id="c_submitBtn" class="btn bp" style="width:100%;">संदेश भेजें ✉️</button>
        </div>
      </form>
    </div>
  </div>
</section>

<section class="page" id="p-privacy"><div class="wrap doc" data-doc="privacy"></div></section>
<section class="page" id="p-terms"><div class="wrap doc" data-doc="terms"></div></section>
<section class="page" id="p-disclaimer"><div class="wrap doc" data-doc="disclaimer"></div></section>

privacy:{hi:["गोपनीयता नीति (Privacy Policy)",[["जानकारी का संग्रह","आप नाम, पता, मोबाइल आदि जो भी भरते हैं वह केवल आपके ब्राउज़र में रहता है। हमारे सर्वर पर कोई व्यक्तिगत जानकारी नहीं भेजी जाती।"],["कुकीज़ व स्थानीय भंडारण","हम केवल आपकी थीम (लाइट/नाइट) और भाषा की पसंद आपके ब्राउज़र के LocalStorage में सहेजते हैं।"]]],en:["Privacy Policy",[["Information we collect","Whatever you enter stays strictly in your browser. Nothing is sent to our servers."],["Cookies & local storage","We only save your theme and language preferences locally in your browser."]]]},
terms:{hi:["नियम व शर्तें (Terms & Conditions)",[["उपयोग की शर्तें","यह प्लेटफ़ॉर्म सामान्य मार्गदर्शन हेतु निःशुल्क उपलब्ध है। इसका उपयोग करके आप इन शर्तों से सहमत होते हैं।"],["उपयोगकर्ता की ज़िम्मेदारी","पत्र में भरी गई जानकारी की सत्यता और उसे जमा करने की ज़िम्मेदारी पूरी तरह आपकी है।"]]],en:["Terms & Conditions",[["Terms of use","This platform is provided free of charge for general guidance."],["User responsibility","You are solely responsible for the accuracy of information entered in the letters."]]]},
disclaimer:{hi:["अस्वीकरण (Disclaimer)",[["कोई सरकारी संबद्धता नहीं","यह वेबसाइट किसी भी सरकारी संस्थान, विभाग अथवा बैंक से आधिकारिक रूप से संबद्ध नहीं है।"],["केवल नमूना प्रारूप","यहाँ दिए गए पत्र केवल नमूने हैं। संबंधित संस्था के नियमों की पुष्टि अवश्य करें।"]]],en:["Disclaimer",[["No government affiliation","This website is not officially affiliated with any government body or department."],["Sample formats only","The letters provided are standard samples only."]]]}
};

var $=function(i){return document.getElementById(i)};
var lang="hi",cur="caste",dark=false;
try{lang=localStorage.getItem("app_lang")||"hi"}catch(e){}
function t(k){return UI[lang][k]}
function tpl(id){for(var i=0;i<TP.length;i++)if(TP[i][1]===id)return TP[i];return TP[0]}
function pv(id){var r=tpl(id);return r[lang==="hi"?2:3]}

function fillOptions(sel,arr,vals){var i=sel.selectedIndex<0?0:sel.selectedIndex;sel.innerHTML="";arr.forEach(function(x,n){var o=document.createElement("option");o.textContent=x;o.value=vals?vals[n]:x;sel.appendChild(o)});sel.selectedIndex=Math.min(i,arr.length-1)}

function build(){
document.documentElement.lang=lang;
document.title=t("brand")+" — "+(lang==="hi"?"औपचारिक पत्र जनरेटर":"Formal Letter Generator");
document.querySelectorAll("[data-i]").forEach(function(e){e.textContent=t(e.dataset.i)});
document.querySelectorAll("[data-ph]").forEach(function(e){e.placeholder=t(e.dataset.ph)});
$("langT").textContent=lang==="hi"?"English":"हिंदी";
$("yr").textContent=new Date().getFullYear();
setThemeLabel();

// त्वरित सेलेक्ट व 10 कैटेगरी कार्ड्स
var qi=$("quick").selectedIndex<0?0:$("quick").selectedIndex;$("quick").innerHTML="";
var grid=$("cats");grid.innerHTML="";
CATS.forEach(function(c,n){var d=c[lang];
var o=document.createElement("option");o.value=n;o.textContent=(n+1)+". "+d[0];$("quick").appendChild(o);
var card=document.createElement("div");card.className="cat";card.tabIndex=0;
card.innerHTML="<h3>"+(n+1)+". "+d[0]+"</h3><p>"+d[1]+"</p>";
var go=function(){openCat(n)};card.addEventListener("click",go);card.addEventListener("keydown",function(e){if(e.key==="Enter")go()});grid.appendChild(card)});
$("quick").selectedIndex=qi;

// जनरेटर सेलेक्ट
var cs=$("cat");cs.innerHTML="";CATS.forEach(function(c,n){var o=document.createElement("option");o.value=n;o.textContent=(n+1)+". "+c[lang][0];cs.appendChild(o)});
fillOptions($("sal"),t("sal"));fillOptions($("close"),t("cl"));

// स्टेटिक डॉक्यूमेंट्स
document.querySelectorAll("[data-doc]").forEach(function(e){var p=PG[e.dataset.doc][lang];
e.innerHTML="<h2>"+p[0]+"</h2>"+p[1].map(function(s){return"<h3>"+s[0]+"</h3><p>"+s[1]+"</p>"}).join("")});
apply(cur);
}

// सीधा रीडायरेक्ट
function openCat(n){
  if(CATS[n] && CATS[n].s){
    window.location.href = CATS[n].s + ".html";
  }
}

function fillTypes(n){var ts=$("type");ts.innerHTML="";TP.forEach(function(r){if(r[0]===n){var o=document.createElement("option");o.value=r[1];o.textContent=r[lang==="hi"?2:3][0];ts.appendChild(o)}})}
function apply(id){cur=id;var r=pv(id),n=tpl(id)[0];$("cat").value=n;fillTypes(n);$("type").value=id;$("to").value=r[1];$("org").value=r[2];$("subj").value=r[3];$("body").value=r[4];render()}
function fd(v){if(!v)return"__________";var p=v.split("-");return p.length===3?p[2]+"/"+p[1]+"/"+p[0]:v}
function render(){
var L=[t("date")+fd($("date").value),"",t("to"),$("to").value||t("phTo"),$("org").value||t("phOrg"),"",t("subj")+($("subj").value||t("phS")),"",$("sal").value,"",$("body").value||t("phB"),"",t("thanks"),"",$("close").value,$("sName").value||t("phN")];
if($("sRole").value)L.push($("sRole").value);if($("sAddr").value)L.push($("sAddr").value);if($("sMob").value)L.push(t("mob")+$("sMob").value);
$("paper").textContent=L.join("\n")}
["sName","sRole","sAddr","sMob","date","to","org","subj","sal","body","close"].forEach(function(i){$(i).addEventListener("input",render);$(i).addEventListener("change",render)});
$("type").addEventListener("change",function(){apply($("type").value)});
$("cat").addEventListener("change",function(){var n=parseInt($("cat").value,10);for(var i=0;i<TP.length;i++)if(TP[i][0]===n){apply(TP[i][1]);break}});
$("quickBtn").addEventListener("click",function(){openCat(parseInt($("quick").value,10))});

function goTo(n){
  document.querySelectorAll(".page").forEach(function(p){p.classList.toggle("active",p.id==="p-"+n)});
  document.querySelectorAll("nav.main button").forEach(function(b){if(b.dataset.nav===n)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current")});
  $("mainNav").classList.remove("open");
  if(n==="contact") initCaptcha();
  window.scrollTo(0,0);
}

document.querySelectorAll("[data-nav]").forEach(function(b){
  b.addEventListener("click",function(e){
    e.preventDefault();
    if(b.dataset.nav==="generator"){goTo("home");$("cats").scrollIntoView();return}
    goTo(b.dataset.nav);
  });
});
$("navToggle").addEventListener("click",function(){$("mainNav").classList.toggle("open")});

function setThemeLabel(){$("thI").textContent=dark?"☀️":"🌙";$("thT").textContent=dark?t("light"):t("dark")}
function setTheme(d){dark=d;document.documentElement.setAttribute("data-theme",d?"dark":"light");try{localStorage.setItem("app_theme",d?"dark":"light")}catch(e){}setThemeLabel()}
try{dark=localStorage.getItem("app_theme")==="dark"}catch(e){}
$("themeBtn").addEventListener("click",function(){setTheme(!dark)});
document.documentElement.setAttribute("data-theme",dark?"dark":"light");

$("langBtn").addEventListener("click",function(){lang=lang==="hi"?"en":"hi";try{localStorage.setItem("app_lang",lang)}catch(e){}build()});

$("printBtn").addEventListener("click",function(){window.print()});
function toast(m){var e=$("toast");e.textContent=typeof m==="string"?m:t("copied");e.style.display="block";setTimeout(function(){e.style.display="none"},2500)}
$("copyBtn").addEventListener("click",function(){var x=$("paper").textContent;
if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(x).then(toast,fallback)}else fallback();
function fallback(){var a=document.createElement("textarea");a.value=x;document.body.appendChild(a);a.select();try{document.execCommand("copy")}catch(e){}document.body.removeChild(a);toast()}});
function initDate(){var d=new Date();$("date").value=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
$("resetBtn").addEventListener("click",function(){$("form").reset();initDate();build()});

// --- एंटी-स्पैम मैथ कैप्चा और फॉर्म वैलिडेशन ---
var num1 = 0, num2 = 0, formLoadTime = Date.now();
window.initCaptcha = function(){
  num1 = Math.floor(Math.random() * 8) + 2;
  num2 = Math.floor(Math.random() * 8) + 1;
  var qEl = $("captchaQuestion");
  if(qEl) qEl.textContent = num1 + " + " + num2;
  formLoadTime = Date.now();
};

window.validateContactForm = function(e){
  var honeypot = document.querySelector("input[name='_honey']").value;
  var captchaInput = parseInt($("c_captcha").value, 10);
  var errorMsg = $("captchaError");
  var submitBtn = $("c_submitBtn");

  // 1. हनीपॉट जांच (अगर बॉट ने भरा)
  if(honeypot !== ""){
    e.preventDefault();
    return false;
  }
  // 2. टाइम जांच (3 सेकंड से पहले सबमिशन नहीं)
  if(Date.now() - formLoadTime < 3000){
    alert("कृपया फॉर्म को ध्यानपूर्वक भरकर सबमिट करें।");
    e.preventDefault();
    return false;
  }
  // 3. कैप्चा जांच
  if(captchaInput !== (num1 + num2)){
    e.preventDefault();
    errorMsg.style.display = "block";
    initCaptcha();
    return false;
  }

  errorMsg.style.display = "none";
  submitBtn.disabled = true;
  submitBtn.textContent = "संदेश भेजा जा रहा है...";
  return true;
};

initDate();
build();
initCaptcha();
})();
</script>
</body>
</html>
